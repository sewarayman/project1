<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="./assets/css/output.css" rel="stylesheet">

</head>
<body >
    <header class="py-5 px-6 md:px-0 top-0 shadow-lg">
        <div class="container mx-auto row justify-between">
            
            <div class=" sm:gap-20 lg:gap-28 row">
                <button onclick="window.location.href='index.html'" class="mx-auto mr-2 md:mr-0 nav-link md:hidden"> back </button>
                <a href="#" class="text-3xl">Sewar Fashion</a>
                <ul class=" gap-7 hidden md:row md:mr-2">
                    <li>
                        <button onclick="window.location.href='index.html'" class="nav-link">Home</button>
                    </li>
                    <li>
                        <button onclick="window.location.href='index.html#contact'" class="nav-link">Contact</button>
                    </li>
                </ul>
            </div>
            <div class="flex gap-4">
                <input class="placeholder:text-gray-500 placeholder:italic border 
                              border-forground rounded-2xl px-2 hidden md:row"
                placeholder="Search for anything..."  type="text" name="search"/>
                <button onclick="window.location.href='login.html'" class="nav-link">Login</button>
                <button href="#" class="nav-link hidden md:row"><img src="./assets/css/images/shopss.png" class="w-7 mt-1"/></button>
                       
            
            </div>
        </div>
    </header>

    <section class="collections py-12">
        <div class="container mx-auto px-6 md:px-0">

            <div div class="items text-center grid md:grid-cols-2 lg:grid-cols-3 gap-10">
                
                <button class="shop bg-back">
                    
                    <a href="./Women.html"> <img src="./assets/css/images/shopping/wemon.jpg" class="w-full"/> </a>
                    <h2>Women Clothing</h2>
                    <p>Discover elegant and trendy outfits designed to complement every style and occasion.</p>
                   
                </button>
                
                <button class=" bg-back shop">
                    <a href="./men.html"><img src="./assets/css/images/shopping/men.jpg" class="w-full"/></a>
                    <h2>Men Clothing</h2>
                    <p>Explore modern men’s fashion with comfortable, stylish, and versatile pieces for every day.</p>
                </button>

                <button class="bg-back shop">
                    <a href="./shoes.html"> <img src="./assets/css/images/shopping/shoes.jpg" class="w-full"/></a>
                    <h2>Shoes</h2>
                    <p>Step into comfort and style with our collection of fashionable shoes for every occasion.</p>
                </button>

                <button class="bg-back shop">
                    <a href="./kids.html"> <img src="./assets/css/images/shopping/kids.jpg" class="w-full"/></a>
                    <h2>Kids</h2>
                    <p>Cute, comfortable, and colorful clothing designed for active and happy kids.</p>
                </button>

                <button class=" bg-back shop">
                    <a href="./makeup.html"> <img src="./assets/css/images/shopping/makeup.jpg" class="w-full"/></a>
                    <h2>Makeup</h2>
                    <p>Enhance your natural beauty with premium makeup products for every look and mood.</p>
                </button>

                <button class=" bg-back shop">
                    <a href="./games.html"> <img src="./assets/css/images/shopping/games.jpg" class="w-full"/></a>
                    <h2>Games</h2>
                    <p>Discover exciting games that bring fun, challenge, and entertainment for every player.</p>
                </button>

                <button class=" bg-back shop">
                    <a href="./covers.html"> <img src="./assets/css/images/shopping/mobile.jpg" class="w-full"/></a>
                    <h2>Mobile Covers</h2>
                    <p>Protect your device in style with durable and trendy mobile covers.</p>
                </button>

                <button class="bg-back shop">
                    <a href="./electronics.html"> <img src="./assets/css/images/shopping/electronics.jpg" class="w-full"/></a>
                    <h2>Electronics</h2>
                    <p>Discover the latest electronic gadgets designed to make life smarter and easier.</p>
                </button>

                <button class=" bg-back shop">
                    <a href="./accessories.html"> <img src="./assets/css/images/shopping/accessories.jpg" class="w-full"/></a>
                    <h2>Accessories</h2>
                    <p>Complete your look with elegant accessories that add the perfect finishing touch.</p>
                </button>
            </div>
        </div>
        
    </section>

</html>
